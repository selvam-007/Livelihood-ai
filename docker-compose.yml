# =============================================================================
# docker-compose.yml — LivelihoodAI production stack
# =============================================================================
# Services:
#   api        FastAPI backend (uvicorn, 2 workers)
#   postgres   PostgreSQL 16
#   redis      Redis 7 (rate limiting)
#   frontend   React SPA served by nginx (proxies /api/v1 to api)
#
# Usage:
#   1. Copy backend/.env.example -> backend/.env and fill in all secrets.
#   2. docker compose up -d
#   3. First-time data import: docker compose exec api python scripts/import_catalog.py
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livelihood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-livelihood_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livelihood}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-livelihood}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-livelihood_ai}
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXY_COUNT: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data: